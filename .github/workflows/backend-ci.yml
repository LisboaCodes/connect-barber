name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/**'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connect_barber_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@connect-barber/backend

      - name: Run migrations
        run: npm run db:migrate:deploy --workspace=@connect-barber/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/connect_barber_test

      - name: Run linter
        run: npm run lint --workspace=@connect-barber/backend

      - name: Run unit tests
        run: npm run test --workspace=@connect-barber/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/connect_barber_test

      - name: Run E2E tests
        run: npm run test:e2e --workspace=@connect-barber/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/connect_barber_test

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace=@connect-barber/backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Coolify
        run: |
          curl -X POST ${{ secrets.COOLIFY_BACKEND_WEBHOOK_URL }}
